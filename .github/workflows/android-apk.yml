name: Android APK - LAN Backend

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Backend URL reachable by the Android phone (include /api)
        required: true
        default: http://192.168.100.211:5000/api
        type: string
  push:
    branches:
      - free-user-workflow
    paths:
      - frontend/**
      - .github/workflows/android-apk.yml

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.7
  API_BASE_URL: ${{ inputs.api_base_url || vars.ANDROID_API_BASE_URL || 'http://192.168.100.211:5000/api' }}

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Create build-time configuration
        env:
          GOONG_API_KEY: ${{ secrets.GOONG_API_KEY }}
        run: |
          printf 'GOONG_API_KEY=%s\n' "$GOONG_API_KEY" > .env
          keytool -genkeypair \
            -keystore android/app/debug.keystore \
            -storepass android \
            -keypass android \
            -alias AndroidDebugKey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Validate backend URL
        shell: bash
        run: |
          if [[ ! "$API_BASE_URL" =~ ^https?://[^[:space:]]+/api/?$ ]]; then
            echo "::error::API URL must look like http://192.168.1.10:5000/api"
            exit 1
          fi

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          flutter build apk \
            --release \
            --dart-define=APP_ENV=development \
            --dart-define=API_BASE_URL="${API_BASE_URL%/}"

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/MenuGreen-LAN-${GITHUB_RUN_NUMBER}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MenuGreen-LAN-APK-${{ github.run_number }}
          path: frontend/dist/*.apk
          if-no-files-found: error
          retention-days: 14
