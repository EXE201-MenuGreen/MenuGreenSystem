name: Backend CD - Deploy

on:
  # Trigger bằng tay khi cần
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
  # Auto deploy khi push lên develop (chỉ khi có thay đổi backend)
  push:
    branches:
      - develop
    paths:
      - 'backend/**'

env:
  APP_DIR: /home/ubuntu/apps/menugreen
  DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/menugreensystem

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Expose github.sha as $SHA in the runner environment so appleboy/ssh-action's
      # `envs: SHA` lookup in the next step resolves to the current commit SHA.
      # The deploy script depends on $SHA for:
      #   - the :$SHA-tagged image kept during pruning
      #   - the comparison check in `:main-[0-9a-f]{7}` (used as a Hub tag fallback)
      - name: Export SHA to environment
        run: echo "SHA=${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Check disk space - Before
        run: |
          echo "=== Initial disk space ==="
          df -h

      # Expose migration status from CI
      - name: Check if migration was generated in CI
        id: check_migration
        run: |
          if grep -q "MIGRATION_GENERATED=true" <<< "${{ toJSON(github.event.commits.*.message) }}" 2>/dev/null || \
             curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
               "${{ github.api_url }}/repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}" \
               -q '.workflow_runs[0].conclusion' 2>/dev/null | grep -q "success"; then
            echo "MIGRATION_GENERATED=true" >> $GITHUB_OUTPUT
          else
            echo "MIGRATION_GENERATED=false" >> $GITHUB_OUTPUT
          fi

      # -----------------------------------------------------------------------------
      # Upload nginx config + deploy script to the server.
      #
      # Why deploy-server.sh is uploaded (not inlined into the SSH action):
      #   GitHub Actions caps every ${{ }} expression at 21,000 characters. The
      #   full deploy logic (DB backup, Nginx reload, Doppler secret download,
      #   DB migration health-check, three-tier image rollback, etc.) easily
      #   exceeds that, which previously caused GitHub to reject the workflow
      #   with "Exceeded max expression length 21000 (Line: 69, Col: 19)" —
      #   i.e. the exact validation failure this file fixes.
      #
      # appleboy/scp-action preserves the source path under `target`, so the
      # script ends up at /tmp/nginx-deploy/backend/scripts/deploy-server.sh,
      # which the SSH step invokes below.
      # -----------------------------------------------------------------------------
      - name: Upload nginx config + deploy script to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          # docker-compose.prod.yml lives at the repo root and is consumed by
          # deploy-server.sh (it `cp`'s the file into $APP_DIR before
          # `docker compose up -d`).
          # Copy entire database folder - deploy script will scan and apply *.sql files
          source: "backend/nginx/nginx.conf,backend/nginx/conf.d/cors-map.conf,backend/scripts/deploy-server.sh,backend/database/,docker-compose.prod.yml"
          target: "/tmp/nginx-deploy"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: 22
          envs: DOPPLER_TOKEN,APP_DIR,IMAGE_NAME,SHA
          debug: true
          # SHA is injected via envs above (instead of ${{ github.sha }} in the
          # script body) so it survives the move from YAML to the .sh file.
          # Run the deploy script as the SSH user (e.g. ubuntu), NOT under sudo.
          # Why no `sudo`? appleboy/ssh-action forwards envs: APP_DIR, IMAGE_NAME,
          # SHA, DOPPLER_TOKEN into the remote shell, but `sudo` resets the
          # environment by default. Wrapping the whole script in sudo would
          # strip those vars before deploy-server.sh reads them, causing
          # `mkdir -p "$APP_DIR"` to fail with "cannot create directory ''"
          # (the exact failure we saw in run 8d9e7c2). The script's internal
          # `sudo docker …`, `sudo nginx -t`, etc. keep working because the
          # SSH user has passwordless sudo.
          script: |
            set -e
            chmod +x /tmp/nginx-deploy/backend/scripts/deploy-server.sh
            /tmp/nginx-deploy/backend/scripts/deploy-server.sh
