name: Backend CI - Build & Push

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_VERSION: "9.0"
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/menugreensystem

jobs:
  # ===========================================================================
  # Job 1: Build & Test
  # ===========================================================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: menugreen_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore backend/MenuGreen.sln

      - name: Build
        run: dotnet build backend/MenuGreen.sln --no-restore -c Release

      - name: Test
        env:
          ConnectionStrings__DefaultConnection: >-
            Host=localhost;Port=5432;Database=menugreen_test;
            Username=test;Password=test_password;SSL Mode=Prefer
        run: dotnet test backend/MenuGreen.sln --no-build -c Release --verbosity normal

  # ===========================================================================
  # Job 2: Build & Push Docker Image
  # ===========================================================================
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      short-sha: ${{ steps.vars.outputs.SHORT_SHA }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: docker.io/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Pin the Dockerfile path explicitly. With `context: .` Docker would
          # default to `./Dockerfile` anyway, but pinning prevents drift if
          # someone later tries to add a Dockerfile at a different path.
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Docker Buildx v6 pushes provenance/SBOM attestations by default.
          # On the deploy host, `docker pull` then tries to commit those
          # attestation manifests into containerd's blob store and frequently
          # fails with:
          #   failed commit on ref "attestation-sha256:...": rename ...
          #   no such file or directory
          # because the containerd ingest directory isn't always in sync with
          # the layer blob directory after a `docker image prune`.
          # We don't use the attestations downstream (no cosign verify, no
          # policy check), so turn them off to keep `docker pull` reliable.
          provenance: false
          sbom: false
          build-args: |
            GIT_SHA=${{ github.sha }}

  # ===========================================================================
  # Job 3: Trigger CD Workflow
  # ===========================================================================
  trigger-deploy:
    name: Trigger CD Workflow
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '#skipdeploy')
    permissions:
      actions: write
      contents: read

    steps:
      - name: Trigger CD workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Trigger CD workflow using workflow_dispatch event
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'backend-cd.yml',
              ref: context.ref,
              inputs: {
                environment: context.ref === 'refs/heads/main' ? 'production' : 'staging'
              }
            });
            console.log('CD workflow triggered successfully');
