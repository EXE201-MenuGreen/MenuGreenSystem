name: Flutter Build AAB

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/flutter-*.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug

env:
  FLUTTER_VERSION: "3.24.0"

jobs:
  build-aab:
    name: Build AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ===========================================================
      # Setup Flutter
      # ===========================================================
      - name: Clone Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Verify Flutter
        run: flutter --version

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-${{ hashFiles('frontend/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-

      # ===========================================================
      # Setup Android SDK & Keystore
      # ===========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > frontend/android/local.properties

      - name: Create keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > frontend/android/menugreen_release.jks
          echo "storePassword=$KEYSTORE_PASSWORD" > frontend/android/key.properties
          echo "keyPassword=$KEY_PASSWORD" >> frontend/android/key.properties
          echo "keyAlias=$KEY_ALIAS" >> frontend/android/key.properties
          echo "storeFile=menugreen_release.jks" >> frontend/android/key.properties

      # ===========================================================
      # Download Firebase config
      # ===========================================================
      - name: Download google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" > frontend/android/app/google-services.json

      # ===========================================================
      # Build
      # ===========================================================
      - name: Install dependencies
        run: |
          cd frontend
          flutter pub get

      - name: Build AAB
        run: |
          cd frontend
          flutter build appbundle --${{ github.event.inputs.build_type || 'release' }} --no-tree-shake-icons
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      # ===========================================================
      # Upload artifact
      # ===========================================================
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: menugreen-${{ github.event.inputs.build_type || 'release' }}-aab
          path: frontend/build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

  # Optional: Deploy to Play Console (only on main branch push)
  deploy-play-store:
    name: Upload to Play Store
    runs-on: ubuntu-latest
    needs: build-aab
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Download AAB
        uses: actions/download-artifact@v4
        with:
          name: menugreen-release-aab
          path: .

      - name: Upload to Play Store
        uses: r0adkll/upload-google-playobu@v1
        with:
          service-account-json-json-file: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          package-name: com.menugreen.app
          release-files: app-release.aab
          track: production
          whats-new-directory: frontend/android/app/whatsnew/
          skip-job-dispatch: true
