name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: "9.0"
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/menugreensystem

jobs:
  # ===========================================================================
  # Job 1: Build & Test
  # ===========================================================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: menugreen_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore backend/MenuGreen.sln

      - name: Build
        run: dotnet build backend/MenuGreen.sln --no-restore -c Release

      - name: Test
        env:
          ConnectionStrings__DefaultConnection: >-
            Host=localhost;Port=5432;Database=menugreen_test;
            Username=test;Password=test_password;SSL Mode=Prefer
        run: dotnet test backend/MenuGreen.sln --no-build -c Release --verbosity normal

  # ===========================================================================
  # Job 2: Build & Push Docker Image
  # ===========================================================================
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # Job 3: Deploy to Lightsail
  # ===========================================================================
  deploy:
    name: Deploy to Lightsail
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: 22
          envs: DOPPLER_TOKEN
          debug: true
          script: |
            set -e

            echo "=== Create app directory ==="
            mkdir -p /home/ubuntu/apps/MenuGreenSystem
            cd /home/ubuntu/apps/MenuGreenSystem

            echo "=== Pull latest docker-compose files ==="
            git pull origin main

            echo "=== Create network if not exists ==="
            docker network create menugreen-net 2>/dev/null || true

            echo "=== Install Doppler CLI ==="
            if ! command -v doppler &> /dev/null; then
              mkdir -p ~/.local/bin
              DOPPLER_VERSION="$(curl -fsSL https://api.github.com/repos/DopplerHQ/cli/releases/latest | jq -r .tag_name)"
              curl -fsSL "https://github.com/DopplerHQ/cli/releases/download/${DOPPLER_VERSION}/doppler_${DOPPLER_VERSION#v}_linux_amd64.tar.gz" -o /tmp/doppler.tar.gz
              tar -xzf /tmp/doppler.tar.gz -C ~/.local/bin doppler
              chmod +x ~/.local/bin/doppler
              rm -f /tmp/doppler.tar.gz
              export PATH="$HOME/.local/bin:$PATH"
            fi

            echo "=== Download secrets from Doppler ==="
            export DOPPLER_TOKEN="$DOPPLER_TOKEN"
            doppler secrets download --token "$DOPPLER_TOKEN" --no-file --project menugreen --config prd --format env > /tmp/doppler_raw.env

            echo "=== Build .env file ==="
            printf 'ASPNETCORE_ENVIRONMENT=Production\nASPNETCORE_URLS=http://+:5000\n' > /home/ubuntu/apps/MenuGreenSystem/.env

            # Parse and add secrets
            while IFS='=' read -r key raw_value; do
              [[ -z "$key" || "$key" =~ ^# ]] && continue
              [[ "$key" =~ ^(DB_|REDIS_|DB=|CONNECTIONSTRINGS__|DATABASE_URL=|LIGHTSAIL_SSH_KEY=|REDIS_HOST=|REDIS_PORT=|REDIS_PASSWORD=) ]] && continue

              # Remove quotes from value
              value="${raw_value%\"}"
              value="${value#\"}"
              value="${value%\'}"
              value="${value#\'}"

              # Convert colons to double underscores for .NET nested keys
              net_key="${key//:/__}"

              echo "${net_key}=${value}" >> /home/ubuntu/apps/MenuGreenSystem/.env
            done < /tmp/doppler_raw.env

            # Add DB connection
            DB_CONN="$(grep '^CONNECTIONSTRINGS__DEFAULTCONNECTION=' /tmp/doppler_raw.env | cut -d= -f2- | sed -E 's/^"(.*)"$/\1/')"
            if [ -n "$DB_CONN" ]; then
              echo "ConnectionStrings__DefaultConnection=$DB_CONN" >> /home/ubuntu/apps/MenuGreenSystem/.env
            fi

            # Add Redis connection
            REDIS_CONN="$(grep '^REDIS__CONNECTIONSTRING=' /tmp/doppler_raw.env | cut -d= -f2- | sed -E 's/^"(.*)"$/\1/')"
            if [ -n "$REDIS_CONN" ]; then
              echo "Redis__ConnectionString=$REDIS_CONN" >> /home/ubuntu/apps/MenuGreenSystem/.env
            fi

            # Add JWT settings
            JWT_SECRET="$(grep '^JWT_SECRET=' /tmp/doppler_raw.env | cut -d= -f2- | sed -E 's/^"(.*)"$/\1/')"
            if [ -n "$JWT_SECRET" ]; then
              echo "JwtSettings__SecretKey=$JWT_SECRET" >> /home/ubuntu/apps/MenuGreenSystem/.env
            fi

            JWT_ISSUER="$(grep '^JWT_ISSUER=' /tmp/doppler_raw.env | cut -d= -f2- | sed -E 's/^"(.*)"$/\1/')"
            if [ -n "$JWT_ISSUER" ]; then
              echo "JwtSettings__Issuer=$JWT_ISSUER" >> /home/ubuntu/apps/MenuGreenSystem/.env
            fi

            JWT_AUDIENCE="$(grep '^JWT_AUDIENCE=' /tmp/doppler_raw.env | cut -d= -f2- | sed -E 's/^"(.*)"$/\1/')"
            if [ -n "$JWT_AUDIENCE" ]; then
              echo "JwtSettings__Audience=$JWT_AUDIENCE" >> /home/ubuntu/apps/MenuGreenSystem/.env
            fi

            rm -f /tmp/doppler_raw.env

            echo "=== .env file created ==="
            cat /home/ubuntu/apps/MenuGreenSystem/.env

            echo "=== Deploy with Docker Compose ==="
            docker compose -f docker-compose.prod.yml down --remove-orphans 2>/dev/null || true
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --force-recreate

            echo "=== Wait for API startup ==="
            sleep 30

            echo "=== Verify containers ==="
            docker compose -f docker-compose.prod.yml ps

            echo "=== Health check ==="
            for i in $(seq 1 30); do
              if curl -sf "http://localhost:5000/health/live" > /dev/null 2>&1; then
                echo "API is healthy!"
                exit 0
              fi
              echo "Waiting for API... ($i/30)"
              sleep 5
            done

            echo "=== Container logs ==="
            docker compose -f docker-compose.prod.yml logs --tail=50

            echo "Deployment completed!"
