name: Build and Deploy

on:
  push:
    branches: [main, Tuan]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: exe201-menugreen/menugreen-api
  DOTNET_VERSION: '9.0'

jobs:
  # ===========================================================================
  # Job 1: Build & Test
  # ===========================================================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test123
          POSTGRES_DB: menugreen_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore backend/MenuGreen.sln

      - name: Build
        run: dotnet build backend/MenuGreen.sln --no-restore -c Release

      - name: Test
        env:
          ConnectionStrings__DefaultConnection: >-
            Host=localhost;Port=5432;Database=menugreen_test;
            Username=test;Password=test123;SSL Mode=Prefer
        run: dotnet test backend/MenuGreen.sln --no-build -c Release --verbosity normal

  # ===========================================================================
  # Job 2: Build Docker Image
  # ===========================================================================
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Tuan'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.IMAGE_NAME }}:buildcache,mode=max

  # ===========================================================================
  # Job 3: Deploy to Lightsail
  # ===========================================================================
  deploy:
    name: Deploy to Lightsail
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Tuan'

    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Doppler CLI
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://cli.doppler.com/install.sh | bash -s -- --no-sudo --prefix "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Doppler CLI
        run: |
          set -euxo pipefail
          doppler --version

      - name: Download secrets and build .env
        run: |
          set -euxo pipefail

          echo "Downloading secrets from Doppler..."
          doppler secrets download --token "$DOPPLER_TOKEN" --no-file --project menugreen --config prd --format env > "$GITHUB_WORKSPACE/doppler_raw.env"

          if [ ! -s "$GITHUB_WORKSPACE/doppler_raw.env" ]; then
            echo "ERROR: doppler_raw.env is empty or missing" >&2
            exit 1
          fi

          echo "Doppler secrets downloaded:"
          wc -l "$GITHUB_WORKSPACE/doppler_raw.env"

          # Source Doppler secrets into current shell
          set -a
          source "$GITHUB_WORKSPACE/doppler_raw.env"
          set +a

          # Build .env file with proper .NET configuration format
          # Connection strings are built from separate DB_* variables
          if [ -n "$DB_HOST" ]; then
            echo "ConnectionStrings__DefaultConnection=Host=${DB_HOST};Port=${DB_PORT:-5432};Database=${DB_NAME:-};Username=${DB_USER:-};Password=${DB_PASSWORD:-};SSL Mode=${DB_SSL_MODE:-Require};Trust Server Certificate=true" >> "$GITHUB_WORKSPACE/.env"
          else
            echo "ERROR: No DB connection info found in Doppler" >&2
            exit 1
          fi

          if [ -n "$REDIS__CONNECTIONSTRING" ]; then
            echo "ConnectionStrings__Redis=${REDIS__CONNECTIONSTRING}" >> "$GITHUB_WORKSPACE/.env"
          elif [ -n "$REDIS_URL" ]; then
            echo "ConnectionStrings__Redis=${REDIS_URL}" >> "$GITHUB_WORKSPACE/.env"
          elif [ -n "$REDIS_HOST" ]; then
            echo "ConnectionStrings__Redis=${REDIS_HOST}:${REDIS_PORT:-6379},password=${REDIS_PASSWORD:-}" >> "$GITHUB_WORKSPACE/.env"
          else
            echo "ERROR: No Redis connection string found in Doppler" >&2
            exit 1
          fi

          # Add remaining secrets (skip DB_* and REDIS_* since we already handled connection strings)
          grep -v '^DB_\|^REDIS_\|^DB=' "$GITHUB_WORKSPACE/doppler_raw.env" | while IFS= read -r line; do
            if [ -n "$line" ]; then
              key=$(echo "$line" | cut -d= -f1)
              value=$(echo "$line" | cut -d= -f2-)
              # Convert colon-separated keys to double underscore for .NET
              key=$(echo "$key" | tr ':' '__')
              # Handle nested keys with double underscores
              key=$(echo "$key" | sed 's/__+/__/g')
              echo "${key}=${value}"
            fi
          done >> "$GITHUB_WORKSPACE/.env"

          # JWT aliases - Doppler might store as JWT_SECRET but .NET expects JwtSettings__SecretKey
          if grep -q '^JWT_SECRET=' "$GITHUB_WORKSPACE/doppler_raw.env"; then
            JWT_SECRET_VAL=$(grep '^JWT_SECRET=' "$GITHUB_WORKSPACE/doppler_raw.env" | cut -d= -f2-)
            if ! grep -q '^JwtSettings__SecretKey=' "$GITHUB_WORKSPACE/.env"; then
              echo "JwtSettings__SecretKey=${JWT_SECRET_VAL}" >> "$GITHUB_WORKSPACE/.env"
            fi
          fi
          if grep -q '^JWT_ISSUER=' "$GITHUB_WORKSPACE/doppler_raw.env"; then
            JWT_ISSUER_VAL=$(grep '^JWT_ISSUER=' "$GITHUB_WORKSPACE/doppler_raw.env" | cut -d= -f2-)
            if ! grep -q '^JwtSettings__Issuer=' "$GITHUB_WORKSPACE/.env"; then
              echo "JwtSettings__Issuer=${JWT_ISSUER_VAL}" >> "$GITHUB_WORKSPACE/.env"
            fi
          fi
          if grep -q '^JWT_AUDIENCE=' "$GITHUB_WORKSPACE/doppler_raw.env"; then
            JWT_AUDIENCE_VAL=$(grep '^JWT_AUDIENCE=' "$GITHUB_WORKSPACE/doppler_raw.env" | cut -d= -f2-)
            if ! grep -q '^JwtSettings__Audience=' "$GITHUB_WORKSPACE/.env"; then
              echo "JwtSettings__Audience=${JWT_AUDIENCE_VAL}" >> "$GITHUB_WORKSPACE/.env"
            fi
          fi

          # Verify critical secrets exist
          echo "=== Verifying critical secrets ==="
          if [ ! -s "$GITHUB_WORKSPACE/.env" ] || ! grep -q "^ConnectionStrings__DefaultConnection=" "$GITHUB_WORKSPACE/.env"; then
            echo "ERROR: DB connection info is empty or missing"
            cat "$GITHUB_WORKSPACE/.env"
            exit 1
          fi
          if ! grep -q "^JwtSettings__SecretKey=" "$GITHUB_WORKSPACE/.env" || grep -q "^JwtSettings__SecretKey=$" "$GITHUB_WORKSPACE/.env"; then
            echo "ERROR: JWT SecretKey is empty or missing"
            cat "$GITHUB_WORKSPACE/.env"
            exit 1
          fi
          echo "Secrets verified successfully!"
          cat "$GITHUB_WORKSPACE/.env"

          # Cleanup raw secrets (keep only .env for deployment)
          rm -f "$GITHUB_WORKSPACE/doppler_raw.env"

      - name: Upload .env to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          source: "${{ github.workspace }}/.env"
          target: "/home/ubuntu/apps/MenuGreenSystem"
          strip_components: 0
          overwrite: true

      - name: Rename .env on server and deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            set -e
            APP_DIR="/home/ubuntu/apps/MenuGreenSystem"
            REGISTRY="ghcr.io/exe201-menugreen/menugreen-api"

            mkdir -p $APP_DIR
            cd $APP_DIR

            # .env was already uploaded by scp-action to $APP_DIR/.env

            # Ensure server has the latest compose/config from repo
            if [ -d .git ]; then
              git config --global --add safe.directory $APP_DIR || true
              git fetch origin || true
              git checkout Tuan || true
              git reset --hard origin/Tuan || true
            fi

            # Login to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull $REGISTRY:latest || true

            # Copy docker-compose.prod.yml to server
            # (It should already be in the repo, but ensure it's there)
            if [ ! -f docker-compose.prod.yml ]; then
              echo "ERROR: docker-compose.prod.yml not found on server"
              exit 1
            fi

            # Deploy using docker-compose (starts Redis + API together)
            docker compose -f docker-compose.prod.yml down --remove-orphans 2>/dev/null || true

            # Ensure port 5000 is free before recreating API container
            docker ps --filter "publish=5000" --format "{{.Names}}" | xargs -r docker rm -f || true

            docker compose -f docker-compose.prod.yml up -d --force-recreate --build

            # Wait for containers to be healthy
            echo "Waiting for containers to start..."
            sleep 10

            # Verify containers are running
            docker compose -f docker-compose.prod.yml ps

            docker system prune -f
            echo "Deployment completed successfully!"

      - name: Wait for API to be healthy
        run: |
          for i in {1..30}; do
            if curl -sf http://${{ secrets.LIGHTSAIL_HOST }}:5000/health > /dev/null 2>&1; then
              echo "API is healthy!"
              exit 0
            fi
            echo "Waiting for API... ($i/30)"
            sleep 5
          done
          echo "API health check failed!"
          exit 1

      - name: Run Database Migration
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            cd /home/ubuntu/apps/MenuGreenSystem
            docker compose -f docker-compose.prod.yml exec api dotnet ef database update --project backend/MenuGreen.DataAccessLayer/MenuGreen.DataAccessLayer.csproj --startup-project backend/MenuGreen.API/MenuGreen.API.csproj || echo "Migration may have already been applied"

      - name: Verify deployment
        run: |
          echo "Checking API health..."
          curl -sf http://${{ secrets.LIGHTSAIL_HOST }}:5000/health || echo "Health endpoint may not be configured"
          echo "Checking Swagger..."
          curl -sf http://${{ secrets.LIGHTSAIL_HOST }}:5000/swagger/index.html || echo "Swagger may not be available"
          echo "Deployment verification complete!"
