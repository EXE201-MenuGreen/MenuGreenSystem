name: Build and Deploy

on:
  push:
    branches: [main, Tuan]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/menugreen-api
  DOTNET_VERSION: '9.0'

jobs:
  # ===========================================================================
  # Job 1: Build & Test
  # ===========================================================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test123
          POSTGRES_DB: menugreen_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore backend/MenuGreen.sln

      - name: Build
        run: dotnet build backend/MenuGreen.sln --no-restore -c Release

      - name: Test
        env:
          ConnectionStrings__DefaultConnection: >-
            Host=localhost;Port=5432;Database=menugreen_test;
            Username=test;Password=test123;SSL Mode=Prefer
        run: dotnet test backend/MenuGreen.sln --no-build -c Release --verbosity normal

  # ===========================================================================
  # Job 2: Build Docker Image
  # ===========================================================================
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Tuan'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.IMAGE_NAME }}:buildcache,mode=max

  # ===========================================================================
  # Job 3: Deploy to Lightsail
  # ===========================================================================
  deploy:
    name: Deploy to Lightsail
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Tuan'
    environment:
      name: production
      url: https://api.menugreen.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.LIGHTSAIL_SSH_KEY }}

      - name: Add known hosts
        run: |
          ssh-keyscan -H ${{ secrets.LIGHTSAIL_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy via SSH
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_IMAGE: ghcr.io/${{ env.IMAGE_NAME }}
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }} << 'ENDSSH'
            set -e

            # Configuration
            APP_DIR="/home/ubuntu/apps/MenuGreenSystem"
            REGISTRY="$GHCR_IMAGE"
            IMAGE_TAG="{{ steps.meta.outputs.tags }}"
            DB_HOST="${{ secrets.DB_HOST }}"
            DB_PORT="${{ secrets.DB_PORT }}"
            DB_NAME="${{ secrets.DB_NAME }}"
            DB_USER="${{ secrets.DB_USER }}"
            DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
            REDIS_PASSWORD="${{ secrets.REDIS_PASSWORD }}"
            GF_ADMIN_PASSWORD="${{ secrets.GF_SECURITY_ADMIN_PASSWORD }}"

            # Create app directory
            mkdir -p $APP_DIR

            # Login to GHCR from server
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull latest image
            docker pull $REGISTRY:latest || true

            # Stop and remove old container
            docker stop menugreen-api || true
            docker rm menugreen-api || true

            # Create .env file
            cat > $APP_DIR/.env << EOF
            ASPNETCORE_ENVIRONMENT=Production
            ASPNETCORE_URLS=http://+:5000
            ConnectionStrings__DefaultConnection=Host=$DB_HOST;Port=$DB_PORT;Database=$DB_NAME;Username=$DB_USER;Password=$DB_PASSWORD;SSL Mode=Require
            Redis__Host=localhost
            Redis__Port=6379
            Redis__Password=$REDIS_PASSWORD
            JWT__Secret=${{ secrets.JWT_SECRET }}
            JWT__Issuer=MenuGreenAPI
            JWT__Audience=MenuGreenApp
            GF_SECURITY_ADMIN_PASSWORD=$GF_ADMIN_PASSWORD
            API_URL=http://localhost:5000
            EOF

            # Run new container
            docker run -d \
              --name menugreen-api \
              --restart unless-stopped \
              --env-file $APP_DIR/.env \
              -p 5000:5000 \
              $REGISTRY:latest

            # Cleanup
            docker system prune -f

            echo "Deployment completed successfully!"
          ENDSSH

      - name: Wait for API to be healthy
        run: |
          for i in {1..30}; do
            if curl -sf http://${{ secrets.LIGHTSAIL_HOST }}:5000/health > /dev/null 2>&1; then
              echo "API is healthy!"
              exit 0
            fi
            echo "Waiting for API... ($i/30)"
            sleep 5
          done
          echo "API health check failed!"
          exit 1

      - name: Run Database Migration
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            cd /home/ubuntu/apps/MenuGreenSystem
            docker exec menugreen-api dotnet ef database update --project backend/MenuGreen.DataAccessLayer/MenuGreen.DataAccessLayer.csproj --startup-project backend/MenuGreen.API/MenuGreen.API.csproj || echo "Migration may have already been applied"

      - name: Verify deployment
        run: |
          echo "Checking API health..."
          curl -sf http://${{ secrets.LIGHTSAIL_HOST }}:5000/health || echo "Health endpoint may not be configured"
          echo "Checking Swagger..."
          curl -sf http://${{ secrets.LIGHTSAIL_HOST }}:5000/swagger/index.html || echo "Swagger may not be available"
          echo "Deployment verification complete!"

  # ===========================================================================
  # Job 4: Setup Monitoring Stack
  # ===========================================================================
  setup-monitoring:
    name: Setup Monitoring Stack
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Tuan'
    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.LIGHTSAIL_SSH_KEY }}

      - name: Add known hosts
        run: |
          ssh-keyscan -H ${{ secrets.LIGHTSAIL_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy Monitoring Stack
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            set -e

            APP_DIR="/home/ubuntu/apps/MenuGreenSystem"

            # Copy monitoring files
            cp $APP_DIR/docker-compose.monitoring.yml $APP_DIR/docker-compose.monitoring.yml.bak 2>/dev/null || true

            # Stop existing monitoring containers
            cd $APP_DIR
            docker compose -f docker-compose.monitoring.yml down 2>/dev/null || true

            # Start monitoring stack
            docker compose -f docker-compose.monitoring.yml up -d

            echo "Monitoring stack deployed!"
            echo "Grafana: http://${{ secrets.LIGHTSAIL_HOST }}:3000"
            echo "Prometheus: http://${{ secrets.LIGHTSAIL_HOST }}:9090"

      - name: Health Check
        run: |
          sleep 10
          echo "Checking monitoring services..."
          curl -sf http://${{ secrets.LIGHTSAIL_HOST }}:9090/-/healthy || echo "Prometheus may still be starting"
          curl -sf http://${{ secrets.LIGHTSAIL_HOST }}:3000/api/health || echo "Grafana may still be starting"
          echo "Monitoring setup complete!"
