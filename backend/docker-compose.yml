version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: menugreen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-MenuGreenDb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-MenuGreenDb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - menugreen-network

  # Backend API
  # NOTE: Dockerfile lives at the repo ROOT (not in backend/), so the build
  # context is `../` (parent of backend/) and dockerfile points up one level.
  api:
    build:
      context: ..
      dockerfile: ../Dockerfile
    container_name: menugreen-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-5000}:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://0.0.0.0:5000
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-MenuGreenDb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - JwtSettings__SecretKey=${JWT_SECRET_KEY}
      - JwtSettings__Issuer=${JWT_ISSUER:-MenuGreenAPI}
      - JwtSettings__Audience=${JWT_AUDIENCE:-MenuGreenApp}
      - Firebase__CredentialPath=${FIREBASE_CREDENTIAL_PATH:-}
      - Redis__ConnectionString=${REDIS_CONNECTION_STRING:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - menugreen-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:1.25-alpine
    container_name: menugreen-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
    networks:
      - menugreen-network

volumes:
  postgres-data:
    driver: local
  nginx-logs:
    driver: local

networks:
  menugreen-network:
    driver: bridge
