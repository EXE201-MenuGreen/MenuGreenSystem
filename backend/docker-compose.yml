version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: menugreen_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: MenuGreenDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: menugreen_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=5000
      # Quan trọng: Đổi Host=localhost thành Host=db (trỏ đến container db ở trên)
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=MenuGreenDb;Username=postgres;Password=12345
    ports:
      - "5000:5000"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data:
