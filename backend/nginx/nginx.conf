user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'origin=$http_origin';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Important: must be larger than longest domain in cors-map.conf
    map_hash_bucket_size 128;

    # CORS origin map (whitelist-based for security)
    include /etc/nginx/conf.d/cors-map.conf;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:1r/m;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # Upstream backend API
    # NOTE: Nginx chạy trên HOST (không trong Docker), nên trỏ vào localhost:5000
    # (API container publish port 5000 ra host qua docker-compose.prod.yml)
    upstream api_backend {
        server 127.0.0.1:5000;
        keepalive 32;
    }

    # HTTP server - redirect to HTTPS
    # server {
    #     listen 80;
    #     server_name _;
    #     return 301 https://$host$request_uri;
    # }

    # HTTPS server
    server {
        listen 80;
        server_name api.menugreen.food;

        # SSL Certificate
        # ssl_certificate /etc/nginx/ssl/fullchain.pem;
        # ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        # ssl_protocols TLSv1.2 TLSv1.3;
        # ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        # ssl_prefer_server_ciphers off;
        # ssl_session_cache shared:SSL:10m;
        # ssl_session_timeout 1d;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # CORS headers using dynamic map
        add_header Access-Control-Allow-Origin "$cors_origin" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Api-Key" always;
        add_header Access-Control-Expose-Headers "Content-Length,Content-Range,X-Request-Id" always;
        add_header Access-Control-Max-Age "86400" always;

        # Rate limiting
        limit_req zone=api burst=20 nodelay;
        limit_conn addr 10;

        # Proxy to backend API
        location / {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Origin $http_origin;
            proxy_set_header Connection "";

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # For large file uploads
            client_max_body_size 50m;

            # Disable buffering for streaming responses
            proxy_buffering off;
        }

        # Health check endpoints (no CORS needed)
        location = /health {
            proxy_pass http://api_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            add_header Content-Type application/json;
            add_header Access-Control-Allow-Origin "*";
            return 200 '{"status":"Healthy"}';
        }

        location = /health/ready {
            proxy_pass http://api_backend/health/ready;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            add_header Content-Type application/json;
            add_header Access-Control-Allow-Origin "*";
        }

        location = /health/live {
            add_header Content-Type application/json;
            add_header Access-Control-Allow-Origin "*";
            return 200 '{"status":"Live"}';
        }

        # Preflight CORS (OPTIONS)
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Prometheus metrics
        location = /metrics {
            proxy_pass http://api_backend/metrics;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            add_header Content-Type text/plain;
        }

        # Swagger UI
        location /swagger {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            add_header Content-Type text/plain;
            return 500 '{"error":"Internal Server Error","message":"Please try again later"}';
        }
    }

    # Catch-all HTTP -> HTTPS redirect (uncomment when SSL is configured)
    # server {
    #     listen 443 ssl;
    #     server_name _;
    #     return 301 https://$host$request_uri;
    # }
}
