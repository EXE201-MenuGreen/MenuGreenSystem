user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Never log query strings (SignalR carries access_token there). Redact
    # bearer-style share tokens embedded in the PT review path as well.
    map $uri $safe_log_uri {
        default $uri;
        ~*^/api/ptreview/shared-reports/ /api/PtReview/shared-reports/[REDACTED];
    }

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $safe_log_uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'origin=$http_origin';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Important: must be larger than longest domain in cors-map.conf
    map_hash_bucket_size 128;

    # CORS origin map (whitelist-based for security)
    include /etc/nginx/conf.d/cors-map.conf;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=1r/m;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # Upstream backend API
    # NOTE: Nginx chạy trên HOST (không trong Docker), nên trỏ vào localhost:5000
    # (API container publish port 5000 ra host qua docker-compose.prod.yml)
    upstream api_backend {
        server 127.0.0.1:5000;
        keepalive 32;
    }

    # HTTP server - redirect to HTTPS
    # server {
    #     listen 80;
    #     server_name _;
    #     return 301 https://$host$request_uri;
    # }

    # HTTPS server (Cloudflare Origin Certificate)
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.menugreen.food;

        # Cloudflare Origin Certificate
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # CORS headers handled by backend (.NET) to avoid duplicate headers
        # Backend MenuGreen.API/Program.cs owns CORS policy
        # ASP.NET Core CORS middleware AUTOMATICALLY handles OPTIONS preflight
        # requests and returns correct Access-Control-* headers.
        # DO NOT block OPTIONS here - let it reach the backend.

        # Rate limiting
        limit_req zone=api burst=20 nodelay;
        limit_conn addr 10;

        location / {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Origin $http_origin;
            proxy_set_header Connection "";

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # API JSON is capped at 1 MiB; CV image uploads are capped at 10 MiB.
            client_max_body_size 11m;

            # Disable buffering for streaming responses
            proxy_buffering off;
        }

        # Health check endpoints (no CORS needed)
        location = /health {
            proxy_pass http://api_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location = /health/ready {
            proxy_pass http://api_backend/health/ready;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location = /health/live {
            proxy_pass http://api_backend/health/live;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }


        # Prometheus metrics
        location = /metrics {
            proxy_pass http://api_backend/metrics;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            add_header Content-Type text/plain;
        }

        # Swagger UI
        location /swagger {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            add_header Content-Type text/plain;
            return 500 '{"error":"Internal Server Error","message":"Please try again later"}';
        }
    }

    # HTTP -> HTTPS redirect (for direct access, Cloudflare handles automatically)
    server {
        listen 80;
        listen [::]:80;
        server_name api.menugreen.food;
        return 301 https://$host$request_uri;
    }

    # Catch-all HTTPS for other domains on this server
    # NOTE: ssl_reject_handshake is nginx-plus only; use self-signed cert as fallback for nginx OSS
    # Self-signed cert is generated by CI/CD workflow (see backend-cd.yml [0a] step)
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name _;
        ssl_certificate /etc/ssl/certs/menugreen-catchall.pem;
        ssl_certificate_key /etc/ssl/private/menugreen-catchall.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        return 444;
    }
}
