# CORS Origin Map - Whitelist các domain được phép
# Include trong http {} context nên đặt ở conf.d/
# NOTE: map_hash_bucket_size 128 đã set ở nginx.conf (đủ cho domain dài)

map $http_origin $cors_origin {
    default "";

    # =============================================
    # PRODUCTION DOMAINS - Thêm domain mới ở đây
    # =============================================

    "https://www.menugreen.food"     "https://www.menugreen.food";
    "https://menugreen.food"         "https://menugreen.food";
    "https://admin.menugreen.food"  "https://admin.menugreen.food";

    # =============================================
    # VERCEL / STAGING DOMAINS
    # =============================================

    "https://menu-green-system-ldw5frytu-johnny-dangs-projects.vercel.app"
        "https://menu-green-system-ldw5frytu-johnny-dangs-projects.vercel.app";

    # =============================================
    # LOCALHOST - Development
    # =============================================

    "http://localhost:3000"          "http://localhost:3000";
    "http://localhost:3001"         "http://localhost:3001";
    "http://localhost:5173"         "http://localhost:5173";
    "http://127.0.0.1:3000"         "http://127.0.0.1:3000";
    "http://127.0.0.1:5173"         "http://127.0.0.1:5173";
}
