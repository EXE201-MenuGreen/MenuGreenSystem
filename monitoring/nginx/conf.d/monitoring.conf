# =============================================================================
# Monitoring Reverse Proxy Configuration
# =============================================================================

# Prometheus - Metrics endpoint
server {
    listen 80;
    server_name prometheus.menugreen.com;

    location / {
        proxy_pass http://prometheus:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Allow /metrics without auth for scraping
    location /metrics {
        proxy_pass http://prometheus:9090/metrics;
        allow all;
    }
}

# Grafana - Dashboards
server {
    listen 80;
    server_name grafana.menugreen.com;

    # Basic auth for Grafana
    auth_basic "Restricted Access";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Websocket support for Grafana
    location /api/ws/ {
        proxy_pass http://grafana:3000/api/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}

# Alertmanager - Alert management
server {
    listen 80;
    server_name alertmanager.menugreen.com;

    location / {
        proxy_pass http://alertmanager:9093;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# cAdvisor - Container metrics UI
server {
    listen 80;
    server_name cadvisor.menugreen.com;

    location / {
        proxy_pass http://cadvisor:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Node Exporter - System metrics endpoint
server {
    listen 80;
    server_name node-exporter.menugreen.com;

    location / {
        proxy_pass http://node-exporter:9100;
        proxy_set_header Host $host;
    }

    # Restrict metrics endpoint
    location /metrics {
        return 403;
    }
}
