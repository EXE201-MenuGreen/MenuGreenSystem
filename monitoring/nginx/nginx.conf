upstream menugreen_api {
    server api:5000;
}

upstream grafana {
    server grafana:3000;
}

upstream prometheus {
    server prometheus:9090;
}

upstream cadvisor {
    server cadvisor:8080;
}

server {
    listen 80;
    server_name localhost;

    # Redirect HTTP to HTTPS (uncomment when SSL is configured)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://menugreen_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check - public, no auth
    location /health {
        proxy_pass http://menugreen_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health/ready {
        proxy_pass http://menugreen_api/health/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health/live {
        proxy_pass http://menugreen_api/health/live;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Prometheus - protected with basic auth
    location /prometheus {
        auth_basic "Prometheus Monitoring";
        auth_basic_user_file /etc/nginx/.htpasswd;
        
        proxy_pass http://prometheus;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Allow Prometheus UI
        proxy_set_header Accept-Encoding "";
        sub_filter_types text/html;
        sub_filter_once on;
        sub_filter 'http://prometheus:9090' 'https://$host/prometheus';
    }

    # Grafana - protected with basic auth
    location /grafana {
        auth_basic "Grafana Dashboard";
        auth_basic_user_file /etc/nginx/.htpasswd;
        
        proxy_pass http://grafana;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        
        # Grafana specific headers
        proxy_set_header X-Grafana-User $remote_user;
    }

    # cAdvisor - protected with basic auth
    location /cadvisor {
        auth_basic "Container Metrics";
        auth_basic_user_file /etc/nginx/.htpasswd;
        
        proxy_pass http://cadvisor;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Prometheus metrics endpoint - protected
    location /metrics {
        auth_basic "Metrics";
        auth_basic_user_file /etc/nginx/.htpasswd;
        
        proxy_pass http://menugreen_api/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

