# =============================================================================
# Alertmanager Configuration for MenuGreen System
# =============================================================================

global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@menugreen.com'
  smtp_auth_username: 'alerts@menugreen.com'
  smtp_auth_identity: 'alerts@menugreen.com'
  smtp_auth_password: '${SMTP_PASSWORD}'

# =============================================================================
# Templates
# =============================================================================
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# =============================================================================
# Route Configuration
# =============================================================================
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default'
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: true

    # Warning alerts
    - match:
        severity: warning
      receiver: 'warning-alerts'

    # High traffic alerts
    - match:
        alertname: 'HighTraffic'
      receiver: 'warning-alerts'

    # Database alerts
    - match:
        service: 'database'
      receiver: 'database-alerts'

# =============================================================================
# Receivers
# =============================================================================
receivers:
  # Default receiver (email)
  - name: 'default'
    email_configs:
      - to: 'devops@menugreen.com'
        send_resolved: true
        headers:
          subject: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }} - MenuGreen'

  # Critical alerts receiver
  - name: 'critical-alerts'
    email_configs:
      - to: 'devops@menugreen.com,lead@menugreen.com'
        send_resolved: true
        headers:
          subject: '[CRITICAL] {{ .GroupLabels.alertname }}'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#critical-alerts'
        send_resolved: true
        title: '{{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
    pagerduty_configs:
      - routing_key: '${PAGERDUTY_ROUTING_KEY}'
        severity: critical
        send_resolved: true

  # Warning alerts receiver
  - name: 'warning-alerts'
    email_configs:
      - to: 'devops@menugreen.com'
        send_resolved: true
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#alerts'
        send_resolved: true
        title: '{{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        color: '{{ if eq .Status "firing" }}warning{{ else }}good{{ end }}'

  # Database alerts receiver
  - name: 'database-alerts'
    email_configs:
      - to: 'dba@menugreen.com,devops@menugreen.com'
        send_resolved: true

# =============================================================================
# Inhibition Rules
# =============================================================================
inhibit_rules:
  # Suppress warnings when critical is firing
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster']

  # Suppress alerts for same alert type
  - source_match:
      alertname: 'InstanceDown'
    target_match_re:
      alertname: '.*'
    equal: ['instance']
