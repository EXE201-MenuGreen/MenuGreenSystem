groups:
  - name: menugreen_alerts
    interval: 30s
    rules:
      # High CPU usage
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is above 80% for more than 5 minutes. Current: {{ $value }}%"

      # Critical CPU usage
      - alert: CriticalCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical CPU usage on {{ $labels.instance }}"
          description: "CPU usage is above 95% for more than 2 minutes. Current: {{ $value }}%"

      # High Memory usage
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is above 85% for more than 5 minutes. Current: {{ $value }}%"

      # Critical Memory usage
      - alert: CriticalMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical memory usage on {{ $labels.instance }}"
          description: "Memory usage is above 95% for more than 2 minutes. Current: {{ $value }}%"

      # High Disk usage
      - alert: HighDiskUsage
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Disk space is below 15%. Current: {{ $value }}%"

      # Critical Disk usage
      - alert: CriticalDiskUsage
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 5
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Critical disk space on {{ $labels.instance }}"
          description: "Disk space is below 5%. Current: {{ $value }}%"

      # API down
      - alert: APIDown
        expr: up{job="menugreen-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "API is down on {{ $labels.instance }}"
          description: "MenuGreen API has been unreachable for more than 1 minute."

      # High API response time
      - alert: HighAPIResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="menugreen-api"}[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API response time on {{ $labels.instance }}"
          description: "95th percentile response time is above 2 seconds. Current: {{ $value }}s"

      # High API error rate
      - alert: HighAPIErrorRate
        expr: rate(http_requests_total{job="menugreen-api", status=~"5.."}[5m]) / rate(http_requests_total{job="menugreen-api"}[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API error rate on {{ $labels.instance }}"
          description: "More than 5% of requests are returning 5xx errors. Current: {{ $value }}%"

      # Container down
      - alert: ContainerDown
        expr: up{job=~"cadvisor"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Container monitoring is down"
          description: "cAdvisor has been unreachable for more than 1 minute."

      # Redis down
      - alert: RedisDown
        expr: redis_connected_clients == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Redis has no connections"
          description: "Redis might be down or has no active connections."
