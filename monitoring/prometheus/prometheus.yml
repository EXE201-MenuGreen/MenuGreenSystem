global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'menugreen-lightsail'
    environment: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ASP.NET Core API metrics
  - job_name: 'menugreen-api'
    metrics_path: '/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['api:5000']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'menugreen-api'

  # Node Exporter (server metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # cAdvisor (Docker container metrics)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
        replacement: 'redis'

  # PostgreSQL (nếu có prometheus exporter)
  - job_name: 'postgres'
    static_configs:
      - targets: ['db:5432']
