version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: menugreen_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: MenuGreenDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - menugreen-net
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: menugreen_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=5000
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=MenuGreenDb;Username=postgres;Password=12345
      - CvService__BaseUrl=http://cv-service:8000
      - CvService__ApiSecretKey=
    ports:
      - "5000:5000"
    depends_on:
      - db
    networks:
      - menugreen-net
    restart: unless-stopped

networks:
  menugreen-net:
    name: menugreen-net
    external: true

volumes:
  postgres_data:
