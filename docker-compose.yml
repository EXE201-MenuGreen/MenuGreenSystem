version: "3.8"

# =====================================================
# MenuGreen System - Local Development Stack
# =====================================================
# Usage:
#   docker compose up -d
#   docker compose down
# =====================================================

services:
  db:
    image: postgres:15-alpine
    container_name: menugreen_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-MenuGreenDb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - menugreen-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: menugreen_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - menugreen-net
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: menugreen_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=5000
      - ConnectionStrings__DefaultConnection=Host=${DB_HOST:-db};Port=${DB_PORT:-5432};Database=${DB_NAME:-MenuGreenDb};Username=${DB_USER:-postgres};Password=${DB_PASSWORD};SSL Mode=${DB_SSL_MODE:-Disable};Trust Server Certificate=${DB_TRUST_SERVER_CERTIFICATE:-true}
      - Redis__ConnectionString=${REDIS_HOST:-redis}:${REDIS_PORT:-6379}
      - CvService__BaseUrl=${CV_SERVICE_BASE_URL}
      - CvService__ApiSecretKey=${CV_SERVICE_API_SECRET_KEY}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - menugreen-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  menugreen-net:
    name: menugreen-net

volumes:
  postgres_data:
  redis_data:
