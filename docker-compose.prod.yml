services:
  redis:
    image: redis:7-alpine
    container_name: menugreen_redis
    volumes:
      - redis_data:/data
    networks:
      - menugreen-net
    restart: unless-stopped
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
        redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD" --maxmemory 200mb --maxmemory-policy allkeys-lru;
      else
        redis-server --appendonly yes --maxmemory 200mb --maxmemory-policy allkeys-lru;
      fi'
    healthcheck:
      test: >
        sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
          redis-cli -a "$$REDIS_PASSWORD" ping;
        else
          redis-cli ping;
        fi'
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: menugreen_api
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=${CONNECTIONSTRINGS__DEFAULTCONNECTION}
      - ConnectionStrings__Redis=${CONNECTIONSTRINGS__REDIS}
      - JwtSettings__Audience=${JWTSETTINGS__AUDIENCE}
      - JwtSettings__ExpiryMinutes=${JWTSETTINGS__EXPIRYMINUTES}
      - JwtSettings__Issuer=${JWTSETTINGS__ISSUER}
      - JwtSettings__SecretKey=${JWTSETTINGS__SECRETKEY}
      - AllowedOrigins=${ALLOWEDORIGINS}
      - Resend__ApiKey=${RESEND__APIKEY}
      - Resend__FromEmail=${RESEND__FROMEMAIL}
      - Resend__FromName=${RESEND__FROMNAME}
      - Firebase__CredentialPath=${FIREBASE__CREDENTIALPATH}
      - CvService__BaseUrl=${CVSERVICE__BASEURL}
      - CvService__ApiSecretKey=${CVSERVICE__APISECRETKEY}
      - ASPNETCORE_METRICS=${ASPNETCORE__METRICS}
      - SePay__WebhookAuthMode=${SEPAY__WEBHOOKAUTHMODE}
      - SePay__WebhookSecret=${SEPAY__WEBHOOKSECRET}
      - SePay__WebhookTimestampToleranceSeconds=${SEPAY__WEBHOOKTIMESTAMPTOLERANCESECONDS}
      - SePay__PaymentCodePrefix=${SEPAY__PAYMENTCODEPREFIX}
      - SePay__PaymentCodeSuffixMinLength=${SEPAY__PAYMENTCODESUFFIXMINLENGTH}
      - SePay__PaymentCodeSuffixMaxLength=${SEPAY__PAYMENTCODESUFFIXMAXLENGTH}
      - SePay__PaymentCodeSuffixLength=${SEPAY__PAYMENTCODESUFFIXLENGTH}
      - SePay__OrderExpiryMinutes=${SEPAY__ORDEREXPIRYMINUTES}
      - SePay__QrImageBaseUrl=${SEPAY__QRIMAGEBASEURL}
      - NutritionAssistant__WorkerUrl=${NUTRITIONASSISTANT__WORKERURL}
    ports:
      - "5000:5000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - menugreen-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  redis_data:

networks:
  menugreen-net:
    external: true
