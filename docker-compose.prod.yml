services:
  api:
    image: docker.io/anhtuan21112004/menugreensystem:latest
    container_name: menugreen_api
    pull_policy: always
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=http://+:5000
      - GIT_SHA=${GIT_SHA:-manual}
    ports:
      - "5000:5000"
    networks:
      - menugreen-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 800M
          cpus: '1.0'
    volumes: []

networks:
  menugreen-net:
    external: true
