services:
  redis:
    image: redis:7-alpine
    container_name: menugreen_redis
    volumes:
      - redis_data:/data
    networks:
      - menugreen-net
    restart: unless-stopped
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
        redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD" --maxmemory 200mb --maxmemory-policy allkeys-lru;
      else
        redis-server --appendonly yes --maxmemory 200mb --maxmemory-policy allkeys-lru;
      fi'
    healthcheck:
      test: >
        sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
          redis-cli -a "$$REDIS_PASSWORD" ping;
        else
          redis-cli ping;
        fi'
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: menugreen_api
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=http://+:5000
    ports:
      - "5000:5000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - menugreen-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 800M
          cpus: '1.0'
    volumes:
      # Uncomment nếu dùng Firebase
      # - /etc/secrets/firebase-adminsdk.json:/etc/secrets/firebase-adminsdk.json:ro

volumes:
  redis_data:

networks:
  menugreen-net:
    external: true
