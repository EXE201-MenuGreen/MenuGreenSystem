services:
  api:
    image: docker.io/anhtuan21112004/menugreensystem:latest
    container_name: menugreen_api
    pull_policy: always
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=http://+:5000
      - GIT_SHA=${GIT_SHA:-manual}
      - Firebase__CredentialPath=${FIREBASE_CREDENTIAL_PATH:-/etc/secrets/firebase-adminsdk.json}
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-true}
    ports:
      # Only the host Nginx reverse proxy may reach Kestrel directly.
      - "127.0.0.1:5000:5000"
    networks:
      - menugreen-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 800M
          cpus: '1.0'
    volumes:
      # Firebase Admin SDK credentials — read-only mount from the host.
      # File is materialized at deploy time by deploy-server.sh from the
      # Doppler secret FIREBASE_CREDENTIALS_JSON, so it's never stored in git.
      # Without this mount, FirebaseAuth.VerifyIdTokenAsync (Google sign-in)
      # and FirebaseMessaging.SendAsync (FCM push notifications) silently
      # fail because FirebaseApp.DefaultInstance == null.
      - /home/ubuntu/apps/menugreen/firebase-adminsdk.json:/etc/secrets/firebase-adminsdk.json:ro

networks:
  menugreen-net:
    external: true
