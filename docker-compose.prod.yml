version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: menugreen_redis
    volumes:
      - redis_data:/data
    networks:
      - menugreen-net
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 200mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: menugreen_api
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_HTTP_PORTS=${ASPNETCORE_HTTP_PORTS}
      - ConnectionStrings__DefaultConnection=${CONNECTIONSTRINGS__DEFAULTCONNECTION}
      - ConnectionStrings__Redis=${CONNECTIONSTRINGS__REDIS}
      - CvService__BaseUrl=${CVSERVICE__BASEURL}
      - CvService__ApiSecretKey=${CVSERVICE__APISECRETKEY}
      - ASPNETCORE_METRICS=${ASPNETCORE_METRICS}
    ports:
      - "5000:5000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - menugreen-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  redis_data:

networks:
  menugreen-net:
    external: true
